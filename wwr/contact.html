<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact</title>
    <meta name="description"
      content="This web page was created by José Sampedro as contact page for WWR.">
    <meta name="author" content="José Ernesto Sampedro Avila">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Company logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="information">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com</p>
        </div>

        <section class="location">
            <h2 class="history-h2">Location</h2>
            <!--             <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque harum accusamus
                consequatur iste exercitationem temporibus blanditiis, eveniet autem est odio.
            </p> -->

            <div>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3032.4019240020643!2d-113.57834869469028!3d37.10053575662318!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2smx!4v1785608612990!5m2!1ses!2smx"
                  width="300" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div>
                <form>
                    <div class="form-item column2">
                        <label for="fullname">Full name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item column2">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                </form>

                <form>
                    <div class="form-item">
                        <label for="feedback">Message:</label>
                        <textarea id="feedback" name="feedback" rows="4"
                          placeholder="Type here"></textarea>
                    </div>
                </form>

                <form>
                    <div class="form-item column1">
                        <input type="checkbox" id="pet" name="pet">
                        <label for="pet">Please suscribe me to the monthyly newsletter</label>

                    </div>
                </form>

                <form>
                    <div class="form-item column2">
                        <label for="general">General Inquiry:</label>
                        <input type="radio" id="general" name="general" required>
                        <label for="reservation">Reservation Question:</label>
                        <input type="radio" id="reservation" name="reservation" required>
                        <label for="website">Website Suggestion:</label>
                        <input type="radio" id="website" name="website" required>
                    </div>
                </form>

                <button type="submit">Submit</button>

            </div>

        </section>

        <section class="employees">
            <h2>We are here to serve you</h2>
            <figure>
                <img src="images/employee1.jpg" alt="employee 1" height="100">
                <figcaption>Employee 1</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="employee 2" height="100">
                <figcaption>Employee 2</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="employee 3" height="100">
                <figcaption>Employee 3</figcaption>
            </figure>
            <!--             <figure>
                <img src="images/fig4.jpg" alt="figure 4" height="100">
                <figcaption>Place 4</figcaption>
            </figure>
            <figure>
                <img src="images/fig5.jpg" alt="figure 5" height="100">
                <figcaption>Place 5</figcaption>
            </figure> -->
        </section>
    </main>
    <footer>
        <p>&copy;2026 | Aqua Rafts | José Ernesto Sampedro Avila</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="facebook" height="30">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="instagram" height="30">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="linkedin" height="30">
            </a>
        </nav>
    </footer>
</body>

</html>
